name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install --user --upgrade buildozer

      - name: Cache Buildozer (SDK + NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Discard incomplete Android SDK from cache
        # A previous broken run cached an android-sdk folder without
        # sdkmanager. If we leave it, buildozer skips the SDK download
        # and fails with "sdkmanager ... does not exist".
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK" ] && [ ! -f "$SDK/tools/bin/sdkmanager" ] && [ ! -d "$SDK/cmdline-tools" ]; then
            echo "Incomplete Android SDK found at $SDK - removing so buildozer reinstalls it"
            rm -rf "$SDK"
          fi

      - name: Build the debug APK
        # SDK licenses are auto-accepted via android.accept_sdk_license
        # in buildozer.spec (buildozer answers the y/N prompt itself,
        # since GitHub runners have no interactive terminal).
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-track-apk
          path: bin/*.apk